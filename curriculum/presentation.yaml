# Presentation config for the web atlas content model.
# Read by scripts/build_site_data.py; contract in rfcs/0000-content-model.md.
# Block order on a page is the order in this file. `ignore` lists fields
# deliberately not rendered; any other unmapped field renders as a `data` block
# and is reported by the build.
version: 1

site:
  title: { en: AI Engineering Atlas, vi: AI Engineering Atlas }
  tagline:
    en: A gap-driven roadmap for software engineers learning modern AI engineering.
    vi: Lộ trình AI engineering cho kỹ sư phần mềm, học đúng phần mình còn thiếu.
  repository: https://github.com/canhta/ai-engineering-atlas
  # The ready route Home shows as a specimen (its first diagnostic task, first source, exit evidence).
  specimen: ai.tool-calling
  links:
    - { kind: github, url: "https://github.com/canhta" }
    - { kind: email, url: "mailto:hello@canhta.com" }
    - { kind: whatsapp, url: "https://wa.me/84825252599" }
    - { kind: zalo, url: "https://zalo.me/84825252599" }
    - { kind: x, url: "https://x.com/canh_builds" }
    - { kind: linkedin, url: "https://www.linkedin.com/in/canhta" }

locales: [en, vi]

vocabularies:
  domain: { from: "curriculum/manifest.yaml#domains", key: id, label: title }
  level:
    from: "curriculum/manifest.yaml#levels"
    values: # merged onto the manifest entries
      L0: { label: { en: awareness, vi: nhận biết } }
      L1: { label: { en: working knowledge, vi: biết dùng } }
      L2: { label: { en: practical competence, vi: làm được } }
      L3: { label: { en: deep engineering competence, vi: hiểu sâu } }
      L4: { label: { en: specialist depth, vi: chuyên gia } }
  status:
    values:
      ready: { label: { en: ready, vi: có lộ trình } }
      coverage: { label: { en: "mapped, no route", vi: "chưa có lộ trình" } }
  # `description`: what counts as evidence for each type (docs/LEARNING_MODEL.md → Competency types and
  # evidence; AGENTS.md → Assessment rules), shown on the How it works page.
  competency_type:
    values:
      concept:
        label: { en: concept, vi: khái niệm }
        description:
          { en: "Explain, distinguish, recall, calculate.", vi: "Giải thích, phân biệt, nhớ lại, tính toán." }
      mechanism:
        label: { en: mechanism, vi: cơ chế }
        description:
          {
            en: "Trace, visualize, implement, predict behavior.",
            vi: "Lần theo từng bước, minh họa, tự viết code, dự đoán hành vi.",
          }
      engineering-skill:
        label: { en: engineering skill, vi: kỹ năng kỹ thuật }
        description: { en: "Build, test, debug, modify.", vi: "Xây dựng, test, debug, sửa." }
      system-operation:
        label: { en: system operation, vi: vận hành hệ thống }
        description: { en: "Configure, observe, recover, automate.", vi: "Cấu hình, theo dõi, khôi phục, tự động hóa." }
      design-judgment:
        label: { en: design judgment, vi: quyết định thiết kế }
        description:
          {
            en: "Compare alternatives, reason from constraints, defend a choice.",
            vi: "So sánh phương án, lập luận từ ràng buộc, bảo vệ lựa chọn.",
          }
      production-competency:
        label: { en: production competency, vi: vận hành production }
        description:
          {
            en: "Ship, measure, detect failure, mitigate, roll back or improve.",
            vi: "Đưa lên production, đo, phát hiện lỗi, giảm thiểu, rollback hoặc cải thiện.",
          }
  # Resource types, so the library can label a source in the page language (site/DESIGN.md → Library).
  resource_type:
    values:
      book: { label: { en: book, vi: sách } }
      course: { label: { en: course, vi: khóa học } }
      paper: { label: { en: paper, vi: paper } }
      article: { label: { en: article, vi: bài viết } }
      documentation: { label: { en: documentation, vi: docs } }
      guide: { label: { en: guide, vi: hướng dẫn } }
      standard: { label: { en: standard, vi: tiêu chuẩn } }
      visual: { label: { en: video, vi: video } }
      repository: { label: { en: repository, vi: repo } }

  # `description`: what each learner state means (docs/LEARNING_MODEL.md → Learner states), shown on
  # the How it works page.
  state:
    values:
      unassessed:
        label: { en: unassessed, vi: chưa đánh giá }
        description: { en: "No meaningful evidence yet.", vi: "Chưa có bằng chứng nào đáng kể." }
      gap:
        label: { en: gap, vi: còn thiếu }
        description:
          {
            en: "A diagnostic found the capability missing.",
            vi: "Bài kiểm tra đầu vào cho thấy bạn còn thiếu kỹ năng này.",
          }
      learning:
        label: { en: learning, vi: đang học }
        description:
          { en: "Instruction or guided practice is in progress.", vi: "Đang đọc tài liệu hoặc thực hành có hướng dẫn." }
      demonstrated:
        label: { en: demonstrated, vi: đã làm được }
        description: { en: "You produced the exit evidence.", vi: "Bạn đã làm ra bằng chứng hoàn thành." }
      transferred:
        label: { en: transferred, vi: vận dụng được }
        description:
          {
            en: "You used the capability on a sufficiently different task.",
            vi: "Bạn đã dùng kỹ năng cho một bài toán đủ khác.",
          }
      retained:
        label: { en: retained, vi: nhớ lâu }
        description:
          { en: "You recalled it successfully after a delay.", vi: "Sau một thời gian, bạn vẫn làm lại được." }
      applied:
        label: { en: applied, vi: dùng trong dự án }
        description:
          {
            en: "You used it in an integrated or real system.",
            vi: "Bạn đã dùng kỹ năng trong một hệ thống thật hoặc tích hợp.",
          }

  # Kinds of dated curriculum change (curriculum/changelog.yaml, rfcs/0021-dated-curriculum-changes.md),
  # shown on the What changed page and on item pages.
  change_kind:
    values:
      promoted: { label: { en: Promoted to ready, vi: Có lộ trình } }
      demoted: { label: { en: Moved back to mapped, vi: Trở lại chưa có lộ trình } }
      added: { label: { en: Added to the map, vi: Thêm vào bản đồ } }
      removed: { label: { en: Removed from the map, vi: Loại bỏ khỏi bản đồ } }
      lab-added: { label: { en: Lab added, vi: Thêm lab } }
      lab-removed: { label: { en: Lab removed, vi: Loại bỏ lab } }

# Dated changes: `entries` maps the model's keys to the change log's; `refs` names, per content key,
# the collection whose items it lists; `decision` resolves to one repository file.
changes:
  from: curriculum/changelog.yaml
  vocabulary: change_kind
  releases: { key: releases, map: { version: version, date: date } }
  entries:
    key: changes
    map: { date: date, kind: kind, release: release, note: note, decision: rfc, predates_review: pre_rfc }
    refs: { competencies: competencies, labs: labs }
  decision_file: "rfcs/{}-*.md"

collections:
  competencies:
    label: { en: Competencies, vi: Kỹ năng }
    items_from: "curriculum/catalog.yaml#competencies"
    id: id
    title: title
    page_from: "{route}/competency.yaml"
    fields:
      domain: { label: { en: Domain, vi: Lĩnh vực }, vocabulary: domain }
      status: { label: { en: Status, vi: Tình trạng }, vocabulary: status }
      target_level: { label: { en: Target level, vi: Mức mục tiêu }, vocabulary: level }
      competency_types: { label: { en: Capability type, vi: Loại kỹ năng }, vocabulary: competency_type }
      target_states: { label: { en: Target, vi: Mục tiêu }, vocabulary: state }
    group_by: domain
    facets: [status, target_level]
    page_when: { field: status, in: [seeded, ready] }
    progress: { tracks: true, target_field: target_states }
    relations:
      - { type: prerequisite, field: prerequisites, direction: in }
      - { type: practice, field: "learning_route.independent_practice[].artifact", direction: out, target: labs }
    blocks:
      - { id: why, field: why, type: text, title: { en: Why, vi: Vì sao cần học } }
      - id: prerequisites
        field: prerequisites
        type: prerequisites
        support: prerequisite_support
        bridge: { diagnostic: diagnostic, resource: source, locator: locator, purpose: purpose }
        title: { en: Prerequisites, vi: Cần biết trước }
      - { id: outcomes, field: outcomes, type: list, title: { en: Outcomes, vi: Bạn sẽ làm được } }
      - id: diagnostic
        step: true
        field: diagnostic
        type: diagnostic
        map: { tasks: tasks, pass_condition: pass_condition }
        title: { en: Diagnostic, vi: Kiểm tra đầu vào }
      - id: sources
        step: true
        field: learning_route.mental_model
        type: sources
        row: { resource: source, locator: locator, purpose: purpose }
        title: { en: Learning route, vi: Tài liệu cần đọc }
      - id: visual
        step: true
        field: learning_route.visual
        type: sources
        row: { resource: source, locator: locator, purpose: purpose }
        title: { en: Visual explanation, vi: Minh họa trực quan }
      - id: practice
        step: true
        field: learning_route
        type: practice
        groups:
          - { field: guided_practice, label: { en: Guided, vi: Có hướng dẫn } }
          - { field: independent_practice, label: { en: Independent, vi: Tự làm } }
        item: { text: task, path: artifact, resource: source, locator: locator }
        title: { en: Practice, vi: Thực hành }
      - { id: experiments, field: experiments, type: list, title: { en: Experiments, vi: Thử nghiệm } }
      - {
          id: exit-evidence,
          step: true,
          field: exit_evidence,
          type: list,
          title: { en: Exit evidence, vi: Bằng chứng hoàn thành },
        }
      - { id: transfer, step: true, field: transfer.task, type: text, title: { en: Transfer, vi: Vận dụng } }
    ignore: [id, title, domain, status, curriculum_evidence, resources, metadata, project_spines, review]

  labs:
    label: { en: Labs, vi: Lab }
    ref_prefix: lab
    items_from: "labs/*/"
    content_from: lab.yaml # optional per lab; a `browser:` contract adds the runner or form block
    fields:
      path: { label: { en: Repository path, vi: Đường dẫn repo } }
      files: { label: { en: Files, vi: File } }
    blocks:
      - { id: brief, file: README.md, type: text, format: markdown, title: { en: Lab brief, vi: Đề bài } }
      - id: runner
        step: true
        field: browser
        type: runner
        map: { runtime: runtime, editable: editable, run: run, reference: reference, files: files, packages: packages }
        title: { en: Run the tests, vi: Chạy test }
      - id: form
        step: true
        field: browser
        type: form
        map: { runtime: runtime, fields: fields }
        title: { en: Answer the rubric, vi: Trả lời theo tiêu chí }

  projects:
    label: { en: Projects, vi: Dự án }
    ref_prefix: project
    items_from: "projects/*/project.yaml"
    title: title
    fields:
      path: { label: { en: Repository path, vi: Đường dẫn repo } }
      spines: { label: { en: Spines, vi: Nhóm } }
    relations:
      - { type: member, field: "milestones[].integrates", direction: out }
    blocks:
      - { id: purpose, field: purpose, type: text, title: { en: Purpose, vi: Mục đích } }
      - id: milestones
        field: milestones
        type: milestones
        item: { id: id, title: title, ask: ask, refs: integrates, evidence: evidence, path: package }
        title: { en: Milestones, vi: Các mốc }
    ignore: [id, title]

  paths:
    label: { en: Paths, vi: Lộ trình theo vai trò }
    ref_prefix: path
    items_from: "paths/*.yaml"
    id: id
    title: title
    fields:
      path: { label: { en: Repository path, vi: Đường dẫn repo } }
    relations:
      - { type: member, field: "stages[].entries[].id", direction: out }
    blocks:
      - { id: audience, field: audience, type: text, title: { en: Audience, vi: Dành cho ai } }
      - id: target-profile
        field: target_profile
        type: list
        title: { en: Target profile, vi: Bạn sẽ làm được }
      - id: assumed
        field: assumes
        type: prerequisites
        title: { en: "Assumed, not taught on this path", vi: "Cần biết sẵn, lộ trình này không dạy" }
      # rfcs/0020-structured-learning-paths.md: stages in path order, each entry a catalog reference.
      - id: stages
        field: stages
        type: sequence
        vocabulary: level
        stage: { id: id, title: title, guidance: guidance, level: target_level, entries: entries }
        entry: { ref: id, required: required, when: when, level: target_level, exceptions: order_exceptions }
        exception: { ref: prerequisite, reason: reason }
        title: { en: Stages, vi: Các giai đoạn }
      - { id: completion, field: completion, type: list, title: { en: Completion standard, vi: Tiêu chuẩn hoàn thành } }
    ignore: [id, title]
