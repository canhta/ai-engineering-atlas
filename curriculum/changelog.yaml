# Dated record of curriculum changes (rfcs/0021-dated-curriculum-changes.md).
#
# The catalog says what is ready now; this file says when it changed and under which decision.
# Append new events at the end, oldest first, in the same pull request that changes the catalog or
# a lab. `make check` replays the events and fails when the result differs from catalog.yaml.
#
# - date: the calendar day the change lands on main (written by the author, checked by the reviewer).
# - kind: promoted | demoted | added | removed | lab-added | lab-removed.
# - rfc: the Accepted curriculum RFC that decided it (not for lab events).
# - pre_rfc and note: only for the closed set of promotions made before the RFC process existed.
# - release: a version from `releases`; an event without one is unreleased.
# - evidence: the commit that made the change, for reviewers (backfilled events only).
#
# Generated from it: the "Curriculum changes" block of CHANGELOG.md (scripts/render_status.py)
# and the site's /{lang}/changelog/ page (scripts/build_site_data.py).
