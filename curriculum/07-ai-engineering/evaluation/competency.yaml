id: ai.evaluation
title: AI Evaluation and Experimentation
domain: ai-engineering
status: ready
competency_types:
  - engineering-skill
  - design-judgment
  - production-competency
target_level: L3
target_states:
  - demonstrated
  - transferred
  - applied
why: AI system changes are difficult to reason about without repeatable evidence for quality, failures, variance, latency, and cost.
curriculum_evidence:
  - book.chip-huyen-ai-engineering
  - course.made-with-ml-evaluation
prerequisites:
  - ml.experimental-design
  - software.testing
outcomes:
  - Define evaluation criteria from a product or system objective.
  - Evaluate system components separately from end-to-end behavior.
  - Build and version representative evaluation data.
  - Combine deterministic, semantic, retrieval, and agent evaluation where appropriate.
  - Measure repeated-run variance for stochastic systems.
  - Perform failure analysis using categories and slices.
  - Turn production failures into regression cases.
  - Define release gates using explicit quality, latency, and cost constraints.
diagnostic:
  tasks:
    - Design an evaluation plan for a prompt, retrieval, or model change without relying only on average answer quality.
    - Explain how to separate retrieval failure from generation failure in a RAG system.
    - Explain when an LLM judge needs calibration and what it should be calibrated against.
    - Decide what evidence would block a release.
  pass_condition: Skip introductory evaluation material only if the learner can produce a concrete evaluation design with component metrics, representative data, failure analysis, repeated runs when needed, and release criteria.
learning_route:
  mental_model:
    - source: book.chip-huyen-ai-engineering
      locator: Chapter 3 "Evaluation Methodology" and Chapter 4 section "Design Your Evaluation Pipeline"
      purpose: Learn exact/model-based/comparative evaluation and connect evaluation criteria, methods, data, and system components.
    - source: course.made-with-ml-evaluation
      locator: Evaluation lesson; overall, per-class, slices, behavioral testing, and online evaluation sections
      purpose: Connect aggregate metrics to failure analysis and production evaluation.
  guided_practice:
    - task: Create an evaluation matrix for one existing AI feature covering objective, unit, dataset, metric, failure categories, latency, cost, and release threshold.
  independent_practice:
    - artifact: labs/evaluation-harness/
      task: Complete the evaluation-harness lab and produce a versioned comparison plus release decision.
experiments:
  - Run the same stochastic system multiple times and measure outcome variance.
  - Compare aggregate metrics with slice-level or failure-category analysis.
  - Calibrate one model-based judge against a small human-reviewed set.
exit_evidence:
  - Produce a versioned evaluation set and rationale for its coverage.
  - Compare two system configurations using explicit metrics.
  - Separate at least one component-level failure from an end-to-end failure.
  - Analyze failure categories or slices rather than only aggregate scores.
  - Define a release gate that includes quality and at least one operational constraint.
transfer:
  task: Redesign the evaluation for an agent workflow with tool calls, including trajectory or tool-use evidence rather than only final-answer quality.
review:
  suggested_intervals_days: [7, 30]
  retrieval_tasks:
    - Reconstruct the evaluation pipeline from objective to release decision.
    - Given a new failure report, decide where it belongs in the eval set and how it should be measured.
project_spines:
  - ai-system
  - production
resources:
  teaching:
    - book.chip-huyen-ai-engineering
    - course.made-with-ml-evaluation
  production-reference:
    - repo.made-with-ml
metadata:
  last_reviewed: 2026-09-22
  evidence_required: true
