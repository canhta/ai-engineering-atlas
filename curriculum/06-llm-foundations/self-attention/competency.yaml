id: llm.self-attention
title: Self-Attention
domain: llm-foundations
status: ready
competency_types:
  - mechanism
target_level: L2
target_states:
  - demonstrated
  - transferred
  - retained
why: Understand and debug the information-mixing mechanism used by transformer models, including its masking and sequence-length costs.
curriculum_evidence:
  - book.raschka-llm-from-scratch
  - course.stanford-cs336
prerequisites:
  - math.dot-product
  - dl.embeddings
  - dl.softmax
outcomes:
  - Explain queries, keys, values, scaling, and causal masking.
  - Trace tensor shapes through a single-head attention calculation.
  - Implement simplified causal self-attention without a framework attention primitive.
  - Visualize and interpret an attention matrix.
  - Relate sequence length to compute and memory cost.
  - Diagnose an incorrect causal mask or tensor-shape bug.
diagnostic:
  tasks:
    - Explain Q, K, and V without using only the phrase "focus on important words."
    - Given a short sequence and tensor shapes, describe the shape of QK^T and the output.
    - Explain why an autoregressive decoder needs a causal mask.
    - Predict how the attention-score matrix changes when sequence length doubles.
    - Implement or debug a tiny single-head attention example without step-by-step guidance.
  pass_condition: Skip guided instruction only if the learner can answer the conceptual items and complete the implementation/debugging task independently enough to satisfy the exit evidence.
learning_route:
  mental_model:
    - source: book.raschka-llm-from-scratch
      locator: Chapter 3, sections 3.3-3.5; main chapter notebook ch03/01_main-chapter-code/ch03.ipynb
      purpose: Progress from attention weights to trainable Q/K/V and causal masking.
  guided_practice:
    - source: book.raschka-llm-from-scratch
      locator: Chapter 3, sections 3.3-3.5 examples
      task: Trace each intermediate tensor, shape, softmax dimension, and mask operation.
  independent_practice:
    - artifact: labs/self-attention/
      task: Complete the causal self-attention lab, tests, visualization, and failure exercise.
  visual:
    - source: visual.3blue1brown-attention
      locator: Attention lesson
      purpose: Build geometric and token-mixing intuition.
    - source: visual.jay-alammar-illustrated-transformer
      locator: Self-attention section
      purpose: Connect self-attention to the transformer block.
experiments:
  - Predict and measure runtime and memory as sequence length increases.
  - Plot attention probabilities before and after causal masking.
  - Inject an off-by-one masking error and diagnose it from the matrix and behavior.
exit_evidence:
  - Explain Q, K, V, scaling, and causal masking from memory.
  - Produce a working causal self-attention implementation with tests.
  - Show and interpret an attention matrix.
  - Diagnose a deliberately broken causal mask.
  - Explain the sequence-length cost using tensor dimensions rather than memorized slogans.
transfer:
  task: Given a non-text sequence such as image patches, explain what self-attention operates on, what remains the same, and whether causal masking is required.
review:
  suggested_intervals_days: [1, 7, 30]
  retrieval_tasks:
    - Redraw the attention computation from memory.
    - Reconstruct the core equations and tensor shapes without notes.
    - Explain one failure caused by an incorrect mask.
project_spines:
  - foundation
resources:
  teaching:
    - book.raschka-llm-from-scratch
  visual:
    - visual.jay-alammar-illustrated-transformer
    - visual.3blue1brown-attention
metadata:
  last_reviewed: 2026-09-22
  evidence_required: true
