id: security.safety-governance
title: "AI Governance and Risk Management"
domain: security-governance
status: ready
competency_types:
  - design-judgment
  - system-operation
  - production-competency
target_level: L3
target_states:
  - demonstrated
  - transferred
  - applied
why: "An AI system can pass its evaluation suite, security review, and release gates and still be deployed without anyone having decided which harms matter, who owns them, how much residual risk is acceptable, or what evidence would reopen the decision. AI governance turns product context, evaluation evidence, affected-party impact, foreseeable misuse, and organizational risk tolerance into explicit risk decisions, owners, treatments, and deployment conditions. Responsible AI is the outcome of that work, not a separate set of principles. Legal obligations enter as jurisdiction-specific inputs that are mapped and escalated, not as universal rules or engineer-issued legal advice."
curriculum_evidence:
  - standard.nist-ai-rmf-core
  - guide.nist-ai-rmf-playbook
  - standard.nist-ai-600-1
  - standard.eu-ai-act
prerequisites:
  - ai.product-framing
  - ai.evaluation
  - production.release-engineering
outcomes:
  - "Define the AI system boundary, intended use, and explicitly excluded uses and contexts."
  - "Identify affected users, non-users, operators, and external parties, including at least one beneficial outcome and one potential harm."
  - "Maintain a versioned AI risk register rather than a one-off risk list."
  - "Distinguish hazard, risk, impact, likelihood, uncertainty, and control."
  - "Identify known and reasonably foreseeable misuse of the system."
  - "Map each high-priority risk to evidence (evaluation results, tests, telemetry, incidents) rather than to severity adjectives alone."
  - "Define risk tolerance, severity criteria, and escalation thresholds before scoring individual risks."
  - "Assign an accountable owner to every material risk and control."
  - "Map each material risk to prevent, detect, mitigate, and recover controls, reusing existing security and release controls where they apply."
  - "Assess residual risk after controls and record who accepted it."
  - "Document risks that cannot currently be measured well and how they are tracked anyway."
  - "Define monitoring and review triggers that reopen the risk decision."
  - "Make a concrete deployment decision (ship, ship with conditions, hold, restrict, or reject) from recorded evidence."
  - "Record accepted, mitigated, transferred, deferred, and rejected risks with rationale."
  - "Distinguish internal product-policy choices from jurisdiction-specific external legal obligations."
  - "Maintain an applicability matrix for external obligations and standards that records jurisdiction, source, version/date, applicability assumption, unresolved interpretation, and escalation owner."
  - "Route uncertain legal applicability or interpretation to specialist legal/compliance review instead of resolving it with model-generated or engineer-generated certainty."
  - "Update the risk record after an incident, product change, or new evidence."
diagnostic:
  tasks:
    - "Given a Knowledge Assistant feature description and its evaluation report, name the affected parties, one foreseeable misuse, and the evidence that would show whether the related risk is acceptable."
    - "Explain the difference between a hazard, a risk, a control, and a residual risk using one concrete example from an AI system you know."
    - "A stakeholder says the system is 'low risk' because accuracy is 94%. Explain what that claim leaves undecided and what you would ask for."
    - "Given a claim that the EU AI Act high-risk obligations apply to an internal documentation assistant, state what facts decide applicability and who should make the interpretation."
    - "Write the deployment decision you would record if one material risk has no owner and no measurement, and explain why."
  pass_condition: "Skip the mental-model sources only if the learner separates hazard, risk, control, and residual risk; ties each material risk to evidence and an owner; makes an explicit deployment decision with conditions; and separates internal policy from jurisdiction-specific legal obligations that require specialist review."
learning_route:
  mental_model:
    - source: standard.nist-ai-rmf-core
      locator: "Section 5 \"AI RMF Core\" and subsections 5.1 \"Govern\", 5.2 \"Map\", 5.3 \"Measure\", 5.4 \"Manage\", including the category and subcategory tables of each function. AI RMF 1.0 is being revised (notice on the page, checked 2026-09-24): record the version you applied."
      purpose: "Build the operating model: governance is cross-cutting, Map establishes context and impacts, Measure produces evidence, Manage allocates treatment and decides whether deployment proceeds, and all four repeat across the lifecycle."
    - source: guide.nist-ai-rmf-playbook
      locator: "Playbook landing page introduction (\"The Playbook is neither a checklist nor set of steps to be followed in its entirety\"; \"Playbook suggestions are voluntary\"), then \"Explore the Playbook\" entries for GOVERN 1.3, GOVERN 2.1, MAP 1.1, MAP 5.1, MEASURE 3.2, and MANAGE 1.3"
      purpose: "Use suggested actions for risk tolerance, ownership, context, impact likelihood/magnitude, hard-to-measure risks, and risk response as options selected by context, not as a compliance checklist."
    - source: standard.nist-ai-600-1
      locator: "Section 2 \"Overview of Risks Unique to or Exacerbated by GAI\" (risk dimensions and the twelve risk categories, especially 2.2 Confabulation, 2.4 Data Privacy, 2.7 Human-AI Configuration, 2.12 Value Chain and Component Integration); Section 3 \"Suggested Actions to Manage GAI Risks\" introduction and tables for GOVERN 1.3, MAP 1.1, MAP 5.1, MEASURE 3.2, MANAGE 1.3; Appendix A.1.4 \"Pre-Deployment Testing\" and A.1.8 \"Incident Disclosure\""
      purpose: "Apply the AI RMF functions to generative AI risks, and see that not every suggested action applies to every actor or system."
    - source: standard.eu-ai-act
      locator: "Consolidated text of 27.07.2026 (as amended by Regulation (EU) 2026/1744): Article 4 \"AI literacy\", Article 9 \"Risk management system\", Article 13 \"Transparency and provision of information to deployers\", Article 26 \"Obligations of deployers of high-risk AI systems\", Article 27 \"Fundamental rights impact assessment for high-risk AI systems\", and Article 113 \"Entry into force and application\" for the dates each part applies"
      purpose: "Jurisdiction-specific example (EU): read how one binding regulation defines a lifecycle risk-management system and deployer duties, then record which facts (role, risk classification, application date) decide whether it applies. Do not generalize EU high-risk obligations to all AI products or jurisdictions."
  guided_practice:
    - task: "Using the Knowledge Assistant product brief, evaluation records, and security evidence, fill one row of the AI risk register end to end: hazard, affected party, likelihood and impact rationale, evidence source, owner, prevent/detect/mitigate/recover controls, residual risk, and review trigger. Compare the row with the NIST AI RMF Map and Manage subcategories you used and note which suggested actions you chose not to apply and why."
  independent_practice:
    - artifact: projects/knowledge-assistant/governance-and-privacy/
      task: "Build the Knowledge Assistant governance package: system/use boundary, affected-party map, risk taxonomy, versioned risk register with owners and controls, one materially uncertain risk, an obligation/applicability matrix with one explicit legal/compliance escalation, and a recorded deployment decision with conditions and review triggers. Then apply one incident or product change and update the register."
experiments:
  - "Score the same risk twice, once with severity adjectives only and once against written tolerance criteria and evidence, and record whether the deployment decision changes."
  - "Remove the owner from one material risk and verify the decision record forces a hold or an explicit acceptance by a named person."
  - "Pick one risk with no reliable metric and design how it is tracked (proxy signal, sampling, user reports, review cadence) instead of dropping it."
  - "Change the product context (a new user group, a new data source, or a write-capable tool) and trace which register rows, controls, and applicability rows must be re-reviewed."
  - "Replay an incident from the incident-and-feedback milestone and update likelihood, controls, residual risk, and review triggers in a new register version."
  - "Take one external obligation, record the applicability assumption and the unresolved question, and write the escalation you would send to legal/compliance without answering it yourself."
exit_evidence:
  - "The system/use boundary names intended uses and excluded uses and contexts."
  - "An affected-party map covers users, non-users, operators, and external parties, with at least one beneficial outcome and one potential harm."
  - "The risk taxonomy and severity/tolerance criteria were written before individual risks were scored."
  - "The versioned risk register links each high-priority risk to an evidence source, not only an adjective."
  - "At least one known or reasonably foreseeable misuse case is registered and treated."
  - "Every material risk and control has a named accountable owner."
  - "Each material risk maps to prevent, detect, mitigate, and recover controls, reusing existing security and release controls where applicable."
  - "Residual risk is assessed after controls and its acceptance is attributed."
  - "At least one risk that remains materially uncertain is documented with how it is tracked."
  - "The obligation/applicability matrix records jurisdiction, source, version/date, applicability assumption, unresolved interpretation, and escalation owner, and separates internal policy from external legal obligations."
  - "At least one legal/compliance question is escalated to a named reviewer rather than resolved by the learner or a model."
  - "The deployment decision is one of ship, ship with conditions, hold, restrict, or reject, and cites the register version and evidence it used."
  - "Post-release review triggers are defined and connected to monitoring or incident signals."
  - "One incident or product change produces a new register version with the changed rows explained."
  - "A slide or list of responsible AI principles without a concrete risk decision is not accepted as evidence."
transfer:
  task: "Apply the same method to a different AI system with a different risk profile, such as a customer-facing agent that can issue refunds or a screening assistant used in hiring. Rebuild the affected-party map, tolerance criteria, and applicability matrix for a second jurisdiction or sector, and state which conclusions from the Knowledge Assistant no longer hold."
project_spines:
  - ai-system
  - production
