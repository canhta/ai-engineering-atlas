name: CI

# Runs on every push and pull request. Everything that decides whether a commit is good
# lives here; deploying is a separate, manual workflow (cd.yml).

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Pinned: `ubuntu-latest` becomes Ubuntu 26 on 2026-10-19, which would change the runner under us.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - name: Validate JSON Schemas
        run: python scripts/validate_schemas.py

      - name: Validate curriculum contracts
        run: python scripts/validate_repo.py

      - name: Validate generated curriculum status
        run: python scripts/render_status.py --check

      - name: Validate learner-facing source blocks
        run: python scripts/render_learning_sources.py --check

      - name: Validate internal links
        run: python scripts/validate_links.py

      - name: Validate lab reference contracts
        run: python scripts/validate_labs.py

      - name: Validate generated site data
        run: python scripts/build_site_data.py --check

      - name: Validate agent docs
        run: python scripts/validate_agent_docs.py

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -r requirements-dev.txt

      - name: Ruff (Python lint and format)
        run: |
          ruff check .
          ruff format --check .

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: site

      - name: Prettier (formatting across the repository)
        run: site/node_modules/.bin/prettier --check .

      - name: ESLint
        run: pnpm exec eslint .
        working-directory: site

  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Includes the Worker tests (pnpm run test:worker): no Cloudflare secrets needed.
      - name: Typecheck, unit and Worker tests, lint, i18n, contrast, headers, icons, build
        run: pnpm run check

      # Browser labs must behave as `python tests.py` does locally (site/scripts/test-labs.mjs).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CPython browser-lab dependencies
        run: python -m pip install -r requirements-labs.txt

      - name: Browser labs under Pyodide match CPython
        run: pnpm run test:labs

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests against the built site (real CSP and headers)
        run: pnpm run test:e2e
