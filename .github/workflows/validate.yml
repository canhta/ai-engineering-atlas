name: Validate curriculum

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - name: Validate JSON Schemas
        run: python scripts/validate_schemas.py

      - name: Validate curriculum contracts
        run: python scripts/validate_repo.py

      - name: Validate generated curriculum status
        run: python scripts/render_status.py --check

      - name: Validate learner-facing source blocks
        run: python scripts/render_learning_sources.py --check

      - name: Validate internal links
        run: python scripts/validate_links.py

      - name: Validate lab reference contracts
        run: python scripts/validate_labs.py

      - name: Validate generated site data
        run: python scripts/build_site_data.py --check

      - name: Validate agent docs
        run: python scripts/validate_agent_docs.py

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, unit tests, lint, i18n, contrast, headers, icons, build
        run: pnpm run check

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests against the built site (real CSP and headers)
        run: pnpm run test:e2e
