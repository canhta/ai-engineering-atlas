name: CD

# Manual only: Actions → CD → Run workflow. Builds the chosen ref and ships it to
# ai-eng.canhta.com. Whether the commit is good is CI's question, answered before this runs.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        default: main
        required: true

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://ai-eng.canhta.com
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The only gate: this commit is already green in CI.
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          sha="$(git rev-parse HEAD)"
          conclusion="$(gh run list --workflow ci.yml --commit "$sha" --limit 1 \
            --json conclusion --jq '.[0].conclusion // "none"')"
          echo "CI for $sha: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Refusing to deploy $sha: its CI run is '$conclusion', not 'success'."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
