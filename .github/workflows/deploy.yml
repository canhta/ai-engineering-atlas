name: Deploy site

# Manual only: Actions → Deploy site → Run workflow. Deploys the chosen ref to ai-eng.canhta.com.
#
# This workflow does not re-run the test suite. Validation belongs to CI ("Validate curriculum"),
# which runs on every push; deploying only checks that CI passed for this exact commit, then
# builds and ships it. Running the suite twice would double the wall clock and still tell us
# nothing new about the commit.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        default: main
        required: true

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://ai-eng.canhta.com
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The gate: this commit must already be green in CI. A run that is still going, failed,
      # or never happened stops the deploy here, before anything is built.
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          sha="$(git rev-parse HEAD)"
          conclusion="$(gh run list --workflow validate.yml --commit "$sha" --limit 1 \
            --json conclusion --jq '.[0].conclusion // "none"')"
          echo "Validate curriculum for $sha: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Refusing to deploy $sha: its 'Validate curriculum' run is '$conclusion', not 'success'."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy

      # The deployed site must answer, carry its security headers, and pass axe in both
      # languages. This is about the deployment, not about the code, so it belongs here.
      - name: Smoke-test the deployed site
        run: |
          pnpm exec playwright install --with-deps chromium
          node scripts/capture.mjs https://ai-eng.canhta.com "${RUNNER_TEMP}/deployed"
